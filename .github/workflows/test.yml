name: Test Features

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the test image matrix
        id: images
        run: npm run ci:test-matrix

  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseImage: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Test all Features against ${{ matrix.baseImage }}
        run: npm run test:features -- --image "${{ matrix.baseImage }}"
